# VM opcore: o proxy público é o opcore_caddy (caddy-docker-proxy) na rede externa `caddy`.
# O processo escuta em 3040. A porta 3000 da VM já é do Grafana.
# Uso: docker compose -f deploy/docker-compose.prod.yml up -d --build

name: atlasmeme

services:
  atlasmeme-web:
    build:
      context: ..
      network: host
    image: atlasmeme/web:latest
    container_name: atlasmeme-web
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file: ../.env
    environment:
      FAROL_REGION: vm
      PORT: "3040"
    volumes:
      - atlasmeme-data:/data
    ports:
      - "127.0.0.1:3040:3040"
    networks:
      - caddy
    labels:
      caddy: atlasmeme.opcore.com.br
      caddy.reverse_proxy: "{{upstreams 3040}}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3040/api/health?quick=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  caddy:
    external: true

volumes:
  atlasmeme-data:
