# Site nginx para o Farol atrás do proxy do host.
# 1) Troque SEU_DOMINIO pelo domínio escolhido (ex.: farol.community).
# 2) sudo cp deploy/nginx-farol.conf /etc/nginx/sites-available/SEU_DOMINIO.conf
#    sudo ln -s /etc/nginx/sites-available/SEU_DOMINIO.conf /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) TLS: sudo certbot --nginx -d SEU_DOMINIO   (certbot adiciona o bloco 443)

upstream farol_upstream {
    server 127.0.0.1:3030;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Estáticos do Next com cache longo (nomes com hash).
    location /_next/static/ {
        proxy_pass http://farol_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://farol_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
